<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Activity 2</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Grechen+Fuemen&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="modal" class="container">
      <div class="header mb anton-regular">Score Evaluator</div>
      <div
        id="content"
        class="container justify-content-center text-align-center mb"
      >
        <p id="text-content" class="inter-regular mb"></p>
      </div>
      <div class="row justify-content-center">
        <button
          id="startBtn"
          class="inter-regular text-align-center"
          onclick="run()"
        >
          Evaluate
        </button>
        <button
          id="clearBtn"
          class="inter-regular text-align-center"
          onclick="clearContent()"
          disabled
        >
          Clear
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
